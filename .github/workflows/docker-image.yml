name: Docker Image CI

on:
  push:
    branches: [ "master", "update/2.30.0" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag n8n-ent:$(date +%s)
