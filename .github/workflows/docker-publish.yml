name: Docker Image Push To CI

on:
  push:
    branches: [ "master", "update/2.27.3", "update/2.36.7" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/marefati110/n8n-ent

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        id: build
        env:
          DOCKER_BUILDKIT: 1
        run: |
          IMAGE_TAG=$(date +'%Y%m%d')
          docker buildx build \
            --file Dockerfile \
            --tag ${{ env.GHCR_IMAGE }}:$IMAGE_TAG \
            --tag ${{ env.GHCR_IMAGE }}:latest \
            --progress=plain \
            --load \
            .
          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.GHCR_IMAGE }}:${{ steps.build.outputs.tag }}
          docker push ${{ env.GHCR_IMAGE }}:latest
          echo "SUCCESS: ${{ env.GHCR_IMAGE }}:latest"