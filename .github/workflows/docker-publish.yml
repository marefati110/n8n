name: Docker Image Push To CI

on:
  push:
    branches: [ "master", "update/2.27.3", "update/2.36.7" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "master" ]

env:
  DOCKER_HUB_IMAGE: marefati110/n8n-ent

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune -af || true

      - name: Add swap space
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        id: build
        env:
          DOCKER_BUILDKIT: 1
        run: |
          IMAGE_TAG=$(date +'%Y%m%d')
          docker buildx build \
            --file Dockerfile \
            --tag ${{ env.DOCKER_HUB_IMAGE }}:$IMAGE_TAG \
            --tag ${{ env.DOCKER_HUB_IMAGE }}:latest \
            --progress=plain \
            --load \
            .
          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: marefati110
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.DOCKER_HUB_IMAGE }}:${{ steps.build.outputs.tag }}
          docker push ${{ env.DOCKER_HUB_IMAGE }}:latest