name: Verify Build

on:
  push:
    branches: [ "update/2.36.7" ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10.32.1
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Build
      run: pnpm build
    - name: Done
      run: echo "SUCCESS: Build verification complete!"